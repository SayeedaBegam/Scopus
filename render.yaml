services:
  - type: web
    name: utn-research-api
    runtime: docker
    plan: free
    rootDir: platform/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SCOPUS_MODE
        value: live
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ELSEVIER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SCHEDULED_SYNC_SECRET
        sync: false
      - key: EXPORT_DIR
        value: /tmp/exports
