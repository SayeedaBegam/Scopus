name: Weekly Scopus synchronization

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate deployment secrets
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          SCHEDULED_SYNC_SECRET: ${{ secrets.SCHEDULED_SYNC_SECRET }}
        run: |
          test -n "$RENDER_BACKEND_URL"
          test -n "$SCHEDULED_SYNC_SECRET"

      - name: Wake backend and synchronize active professors
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          SCHEDULED_SYNC_SECRET: ${{ secrets.SCHEDULED_SYNC_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 4 --retry-all-errors --retry-delay 20 \
            --max-time 2400 \
            -X POST "${RENDER_BACKEND_URL%/}/api/v1/scheduled/scopus-sync" \
            -H "X-Sync-Secret: $SCHEDULED_SYNC_SECRET"
